<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imperium Casino</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}

.container{
    display:flex;
    gap:40px;
}

.box{
    background:#1c1c1c;
    padding:25px;
    border-radius:15px;
    width:300px;
}

h2{
    text-align:center;
    color:gold;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:gold;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:orange;
}

#status{
    margin-top:20px;
    color:lightgreen;
}
</style>
</head>

<body>

<h1 style="color:gold;">🎰 Imperium Casino</h1>

<div class="container">

<div class="box">
<h2>REGISTER</h2>

<input id="regUser" placeholder="Username">
<input id="regPass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
</div>

<div class="box">
<h2>LOGIN</h2>

<input id="logUser" placeholder="Username">
<input id="logPass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

</div>

<div id="status"></div>

<script>

const API = "http://localhost:3001";

function show(msg){
    document.getElementById("status").innerText = msg;
}

async function register(){

    try{

        const username =
        document.getElementById("regUser").value;

        const password =
        document.getElementById("regPass").value;

        const res = await fetch(
            API + "/register",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username,
                    email:"",
                    password
                })
            }
        );

        const data = await res.json();

        show(data.message);

    }catch(err){

        show("Server not running");

    }

}

async function login(){

    try{

        const username =
        document.getElementById("logUser").value;

        const password =
        document.getElementById("logPass").value;

        const res = await fetch(
            API + "/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await res.json();

        if(data.success){

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            window.location.href =
            "dashboard.html";

        }else{

            show(data.message);

        }

    }catch(err){

        console.log(err);

        show("Server error");

    }

}

</script>

</body>
</html>
