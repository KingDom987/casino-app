<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dice Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#1a1a1a,#000);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:700px;
background:rgba(20,20,20,0.95);
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 40px rgba(255,215,0,0.25);
}

h1{
font-size:50px;
color:gold;
margin-bottom:20px;
text-shadow:0 0 20px gold;
}

.Balanca{
font-size:24px;
margin-bottom:20px;
color:gold;
}

input,select{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#222;
color:white;
font-size:18px;
margin-bottom:20px;
text-align:center;
}

.dice{
width:160px;
height:160px;
margin:30px auto;
background:white;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:90px;
color:black;
box-shadow:0 0 20px rgba(255,255,255,0.2);
transition:0.2s;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:gold;
color:black;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:orange;
transform:scale(1.03);
}

#result{
margin-top:25px;
font-size:32px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>🎲 DICE</h1>

<div class="Balanca" id="Balanca">Balanca: $0</div>

<input type="number" id="betInput" placeholder="Enter Bet Amount"/>

<select id="choice">
  <option value="over">ROLL OVER 50</option>
  <option value="under">ROLL UNDER 50</option>
</select>

<div class="dice" id="dice">🎲</div>

<button onclick="rollDice()">ROLL DICE</button>

<div id="result"></div>

</div>

<script>

const API = "https://casino-app-production-d8ee.up.railway.app";

let userData = localStorage.getItem("user");
let user = null;
try { user = JSON.parse(userData); } catch(e) { user = null; }

let Balanca = 0;

async function loadBalance(){
  if(user && user._id){
    const res = await fetch(API + "/balance/" + user._id);
    const data = await res.json();
    Balanca = data.balance || 0;
    document.getElementById("Balanca").innerText = "Balanca: $" + Balanca;
  }
}

loadBalance();

async function rollDice(){
  let bet = parseInt(document.getElementById("betInput").value);

  if(!bet || bet <= 0){
    alert("Enter valid bet");
    return;
  }

  if(Balanca < bet){
    alert("Not enough balance");
    return;
  }

  const betRes = await fetch(API + "/bet", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: user._id, amount: bet })
  });
  const betData = await betRes.json();

  if(!betData.success){
    alert("Not enough balance");
    return;
  }

  Balanca = betData.balance;
  document.getElementById("Balanca").innerText = "Balanca: $" + Balanca;
  document.getElementById("result").innerHTML = "";

  let dice = document.getElementById("dice");
  let spins = 0;

  let interval = setInterval(async () => {
    dice.innerHTML = Math.floor(Math.random()*6)+1;
    spins++;

    if(spins > 15){
      clearInterval(interval);

      let number = Math.floor(Math.random()*100);
      let choice = document.getElementById("choice").value;
      dice.innerHTML = number;

      let win = (choice === "over" && number > 50) || (choice === "under" && number < 50);

      if(win){
        let winnings = bet * 2;
        const winRes = await fetch(API + "/win", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: user._id, amount: winnings })
        });
        const winData = await winRes.json();
        Balanca = winData.balance;
        document.getElementById("result").innerHTML = "🎉 YOU WON $" + winnings;
      }else{
        document.getElementById("result").innerHTML = "💀 YOU LOST";
      }

      document.getElementById("Balanca").innerText = "Balanca: $" + Balanca;
    }
  }, 100);
}

</script>

</body>
</html>
