<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Plinko</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:
radial-gradient(circle at top,#1a1a1a,#000);

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;
}

.box{

width:100%;

max-width:800px;

background:
rgba(20,20,20,0.95);

padding:30px;

border-radius:20px;

text-align:center;

box-shadow:
0 0 40px rgba(255,215,0,0.25);
}

h1{

font-size:50px;

color:gold;

margin-bottom:20px;

text-shadow:
0 0 20px gold;
}

.balance{

font-size:24px;

margin-bottom:20px;

color:gold;
}

input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#222;

color:white;

font-size:18px;

margin-bottom:20px;

text-align:center;
}

/* BOARD */

.board{

position:relative;

width:100%;

height:500px;

margin-top:30px;

overflow:hidden;
}

/* PEGS */

.peg{

width:12px;

height:12px;

background:gold;

border-radius:50%;

position:absolute;
}

/* BALL */

.ball{

width:22px;

height:22px;

background:red;

border-radius:50%;

position:absolute;

left:50%;

top:0;

transform:translateX(-50%);

transition:0.15s linear;
}

/* MULTIPLIERS */

.slots{

display:grid;

grid-template-columns:
repeat(8,1fr);

gap:8px;

margin-top:20px;
}

.slot{

padding:12px;

background:#222;

border-radius:10px;

font-weight:bold;

color:gold;
}

.controls{

display:flex;

gap:15px;

margin-top:25px;
}

button{

flex:1;

padding:15px;

border:none;

border-radius:12px;

background:gold;

color:black;

font-size:18px;

font-weight:bold;

cursor:pointer;
}

button:hover{

background:orange;
}

#result{

margin-top:25px;

font-size:30px;

font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>🎯 PLINKO</h1>

<div class="balance"
id="balance">

</div>

<input
type="number"
id="betInput"
placeholder="Enter Bet Amount"
/>

<div class="board"
id="board">

<div class="ball"
id="ball">

</div>

</div>

<div class="slots">

<div class="slot">x0</div>
<div class="slot">x0.2</div>
<div class="slot">x0.5</div>
<div class="slot">x1</div>
<div class="slot">x2</div>
<div class="slot">x5</div>
<div class="slot">x10</div>
<div class="slot">x50</div>

</div>

<div class="controls">

<button onclick="dropBall()">

DROP BALL

</button>

</div>

<div id="result"></div>

</div>

<script>

/* BALANCE */

let balance =
parseInt(
localStorage.getItem(
"balance"
)
) || 0;

updateBalance();

/* PEGS */

const board =
document.getElementById(
"board"
);

for(let row=0; row<8; row++){

for(let i=0; i<=row; i++){

let peg =
document.createElement(
"div"
);

peg.className =
"peg";

peg.style.left =
(
50 -
row*5 +
i*10
) + "%";

peg.style.top =
(
50 +
row*50
) + "px";

board.appendChild(
peg
);
}
}

/* DROP */

function dropBall(){

let bet =
parseInt(
document.getElementById(
"betInput"
).value
);

if(
!bet ||
bet <= 0
){

alert(
"Enter valid bet"
);

return;
}

if(balance < bet){

alert(
"Not enough balance"
);

return;
}

balance -= bet;

updateBalance();

document.getElementById(
"result"
).innerHTML = "";

let ball =
document.getElementById(
"ball"
);

ball.style.top = "0px";

let y = 0;

let x = 50;

/* ANIMATION */

let interval =
setInterval(() => {

y += 45;

/* RANDOM MOVE */

if(Math.random() > 0.5){

x += 5;

}else{

x -= 5;
}

ball.style.top =
y + "px";

ball.style.left =
x + "%";

/* END */

if(y >= 380){

clearInterval(
interval
);

/* 100% LOSE */

let win =
Math.random() < 0.000;

if(win){

let winnings =
bet * 50;

balance += winnings;

updateBalance();

document.getElementById(
"result"
).innerHTML =
"🎉 WON $" +
winnings;

}else{

document.getElementById(
"result"
).innerHTML =
"💀 LOST";
}
}

},150);
}

/* BALANCE */

function updateBalance(){

document.getElementById(
"balance"
).innerHTML =
"Balance: $" +
balance;

localStorage.setItem(
"balance",
balance
);
}

</script>

</body>
</html>
