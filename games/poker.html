<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Poker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#1a1a1a,#000);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:1000px;
background:rgba(20,20,20,0.95);
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 40px rgba(255,215,0,0.25);
}

h1{
font-size:55px;
color:gold;
margin-bottom:20px;
text-shadow:0 0 20px gold;
}

.Balanca{
font-size:24px;
margin-bottom:20px;
color:gold;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#222;
color:white;
font-size:18px;
margin-bottom:20px;
text-align:center;
}

.table{
background:linear-gradient(145deg,#006400,#003b00);
border-radius:25px;
padding:30px;
margin-top:20px;
}

.section{
margin-bottom:30px;
}

.cards{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:15px;
}

.card{
width:90px;
height:130px;
background:white;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
color:black;
box-shadow:0 0 15px rgba(255,255,255,0.2);
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.start-btn{background:gold;color:black;}
.call-btn{background:limegreen;color:white;}
.fold-btn{background:red;color:white;}

button:hover{transform:scale(1.03);}

#result{
margin-top:30px;
font-size:34px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>🎴 POKER</h1>

<div class="Balanca" id="Balanca">Balanca: $0</div>

<input type="number" id="betInput" placeholder="Enter Bet Amount"/>

<div class="table">
  <div class="section">
    <h2>DEALER</h2>
    <div class="cards" id="dealerCards"></div>
  </div>
  <div class="section">
    <h2>TABLE</h2>
    <div class="cards" id="tableCards"></div>
  </div>
  <div class="section">
    <h2>PLAYER</h2>
    <div class="cards" id="playerCards"></div>
  </div>
</div>

<div class="buttons">
  <button class="start-btn" onclick="startGame()">START</button>
  <button class="call-btn" onclick="callGame()">CALL</button>
  <button class="fold-btn" onclick="foldGame()">FOLD</button>
</div>

<div id="result"></div>

</div>

<script>

const API = "https://casino-app-production-d8ee.up.railway.app";

let userData = localStorage.getItem("user");
let user = null;
try { user = JSON.parse(userData); } catch(e) { user = null; }

let Balanca = 0;
let currentBet = 0;
let gameActive = false;

async function loadBalance(){
  if(user && user._id){
    const res = await fetch(API + "/balance/" + user._id);
    const data = await res.json();
    Balanca = data.balance || 0;
    document.getElementById("Balanca").innerText = "Balanca: $" + Balanca;
  }
}

loadBalance();

const cards = [
  "♠A","♠K","♠Q","♠J",
  "♥A","♥K","♥Q","♥J",
  "♦A","♦K","♦Q","♦J",
  "♣A","♣K","♣Q","♣J"
];

function getCard(){
  return cards[Math.floor(Math.random() * cards.length)];
}

function createCards(amount){
  let html = "";
  for(let i=0;i<amount;i++){
    let card = getCard();
    let red = card.includes("♥") || card.includes("♦");
    html += `<div class="card" style="color:${red ? 'red' : 'black'}">${card}</div>`;
  }
  return html;
}

async function startGame(){
  currentBet = parseInt(document.getElementById("betInput").value);

  if(!currentBet || currentBet <= 0){
    alert("Enter valid bet");
    return;
  }

  if(Balanca < currentBet){
    alert("Not enough balance");
    return;
  }

  const betRes = await fetch(API + "/bet", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: user._id, amount: currentBet })
  });
  const betData = await betRes.json();

  if(!betData.success){
    alert("Not enough balance");
    return;
  }

  Balanca = betData.balance;
  document.getElementById("Balanca").innerText = "Balanca: $" + Balanca;

  gameActive = true;
  document.getElementById("result").innerHTML = "";
  document.getElementById("playerCards").innerHTML = createCards(2);
  document.getElementById("dealerCards").innerHTML = createCards(2);
  document.getElementById("tableCards").innerHTML = createCards(5);
}

async function callGame(){
  if(!gameActive) return;
  gameActive = false;

  let win = Math.random() < 0;

  if(win){
    let winnings = currentBet * 5;
    const winRes = await fetch(API + "/win", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: user._id, amount: winnings })
    });
    const winData = await winRes.json();
    Balanca = winData.balance;
    document.getElementById("result").innerHTML = "🎉 YOU WON $" + winnings;
  }else{
    document.getElementById("result").innerHTML = "💀 DEALER WINS";
  }

  document.getElementById("Balanca").innerText = "Balanca: $" + Balanca;
}

function foldGame(){
  if(!gameActive) return;
  gameActive = false;
  document.getElementById("result").innerHTML = "❌ YOU FOLDED";
}

</script>

</body>
</html>
