<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mines</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:
radial-gradient(circle at top,#1a1a1a,#000);

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;
}

.box{

width:100%;

max-width:700px;

background:
rgba(20,20,20,0.95);

padding:30px;

border-radius:20px;

text-align:center;

box-shadow:
0 0 40px rgba(255,215,0,0.25);
}

h1{

font-size:50px;

color:gold;

margin-bottom:20px;

text-shadow:
0 0 20px gold;
}

.balance{

font-size:24px;

margin-bottom:20px;

color:gold;
}

input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#222;

color:white;

font-size:18px;

margin-bottom:20px;

text-align:center;
}

.grid{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:12px;

margin-top:20px;
}

.tile{

aspect-ratio:1;

background:#222;

border-radius:12px;

display:flex;

justify-content:center;

align-items:center;

font-size:32px;

cursor:pointer;

transition:0.2s;

user-select:none;
}

.tile:hover{

transform:scale(1.05);

background:#333;
}

.safe{

background:limegreen;
}

.mine{

background:red;
}

.controls{

margin-top:25px;

display:flex;

gap:15px;
}

button{

flex:1;

padding:15px;

border:none;

border-radius:12px;

background:gold;

color:black;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:0.2s;
}

button:hover{

background:orange;

transform:scale(1.03);
}

#result{

margin-top:25px;

font-size:30px;

font-weight:bold;
}

.multiplier{

margin-top:15px;

font-size:22px;

color:gold;
}

</style>

</head>

<body>

<div class="box">

<h1>💣 MINES</h1>

<div class="balance"
id="balance">

Balance: $0

</div>

<input
type="number"
id="betInput"
placeholder="Enter Bet Amount"
/>

<div class="multiplier"
id="multi">

Multiplier: x1.0

</div>

<div class="grid"
id="grid">

</div>

<div class="controls">

<button onclick="startGame()">

START

</button>

<button onclick="cashout()">

CASHOUT

</button>

</div>

<div id="result"></div>

</div>

<script>

/* NEW USER = 0 BALANCE */

if(localStorage.getItem("balance") === null){

localStorage.setItem("balance","0");

}

/* LOAD BALANCE */

let balance =
parseInt(
localStorage.getItem("balance")
);

/* UPDATE BALANCE */

function updateBalance(){

document.getElementById(
"balance"
).innerHTML =
"Balance: $" +
balance;

localStorage.setItem(
"balance",
balance
);

}

/* START */

updateBalance();

/* GAME */

let gameActive = false;

let currentBet = 0;

let multiplier = 1;

/* GRID */

const grid =
document.getElementById(
"grid"
);

/* CREATE TILES */

for(let i = 0; i < 25; i++){

let tile =
document.createElement(
"div"
);

tile.className =
"tile";

tile.innerHTML = "?";

tile.onclick = function(){

pickTile(tile);

};

grid.appendChild(tile);

}

/* START GAME */

function startGame(){

currentBet =
parseInt(
document.getElementById(
"betInput"
).value
);

if(
!currentBet ||
currentBet <= 0
){

alert(
"Enter valid bet"
);

return;

}

if(balance < currentBet){

alert(
"Not enough balance"
);

return;

}

balance -= currentBet;

updateBalance();

gameActive = true;

multiplier = 1;

document.getElementById(
"result"
).innerHTML = "";

document.getElementById(
"multi"
).innerHTML =
"Multiplier: x1.0";

/* RESET */

document
.querySelectorAll(
".tile"
)
.forEach(tile => {

tile.className =
"tile";

tile.innerHTML = "?";

});

}

/* TILE CLICK */

function pickTile(tile){

if(!gameActive)
return;

if(
tile.classList.contains(
"safe"
) ||
tile.classList.contains(
"mine"
)
){
return;
}

/* WIN RATE */

let safe =
Math.random() < 0.01;

if(safe){

tile.classList.add(
"safe"
);

tile.innerHTML =
"💎";

multiplier += 0.5;

document.getElementById(
"multi"
).innerHTML =
"Multiplier: x" +
multiplier.toFixed(1);

}else{

tile.classList.add(
"mine"
);

tile.innerHTML =
"💣";

gameActive = false;

document.getElementById(
"result"
).innerHTML =
"💀 YOU LOST";

}

}

/* CASHOUT */

function cashout(){

if(!gameActive)
return;

let winnings =
Math.floor(
currentBet *
multiplier
);

balance += winnings;

updateBalance();

gameActive = false;

document.getElementById(
"result"
).innerHTML =
"🎉 CASHOUT $" +
winnings;

}

</script>

</body>
</html>
