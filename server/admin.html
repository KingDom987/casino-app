<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
</head>

<body style="font-family:Arial;background:#111;color:white;padding:20px;">

<!-- LOGIN -->
<div id="loginPage">
  <h2>🔒 Admin Login</h2>
  <br>
  <input id="adminPass" type="password" placeholder="Fjalëkalimi" style="padding:10px;font-size:16px;border-radius:8px;border:none;width:200px;">
  <br><br>
  <button onclick="adminLogin()" style="padding:10px 20px;background:gold;color:black;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">HYRJE</button>
  <p id="loginError" style="color:red;"></p>
</div>

<!-- PANEL -->
<div id="adminPage" style="display:none;">
  <h2>Admin Panel 💰 Users List</h2>
  <button onclick="loadUsers()">LOAD USERS</button>
  <br><br>

  <div id="users">Loading...</div>
</div>

<script>

const API = "https://casino-app-production-d8ee.up.railway.app";

/* LOGIN */
function adminLogin() {
    const pass = document.getElementById("adminPass").value;

    if (pass === "sheik90") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("adminPage").style.display = "block";
        loadUsers();
    } else {
        document.getElementById("loginError").innerText = "Fjalëkalim i gabuar!";
    }
}

/* LOAD USERS (FIXED + SAFE) */
async function loadUsers() {

    try {
        const res = await fetch(API + "/users");
        const users = await res.json();

        console.log("USERS LOADED:", users);

        if (!Array.isArray(users)) {
            document.getElementById("users").innerHTML =
                "❌ Invalid response from server";
            return;
        }

        if (users.length === 0) {
            document.getElementById("users").innerHTML =
                "⚠️ No users found in database";
            return;
        }

        let html = "";

        users.forEach(user => {
            html += `
            <div style="background:#222;padding:10px;margin:10px;border-radius:10px;">
                <b>${user.username}</b><br>
                Balance: $${user.balance}<br>
                ID: ${user._id}<br><br>

                <input id="a-${user._id}" placeholder="amount" style="padding:5px;width:100px;">

                <button onclick="addBalance('${user._id}')">+ ADD</button>
                <button onclick="removeBalance('${user._id}')">- REMOVE</button>
            </div>
            `;
        });

        document.getElementById("users").innerHTML = html;

    } catch (err) {
        console.log("LOAD USERS ERROR:", err);

        document.getElementById("users").innerHTML =
            "❌ Error loading users (check API /users)";
    }
}

/* ADD BALANCE */
async function addBalance(userId) {

    let amount = document.getElementById("a-" + userId).value;

    if (!amount || amount <= 0) {
        alert("Invalid amount");
        return;
    }

    await fetch(API + "/admin/add-balance", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "admin-password": "1234"
        },
        body: JSON.stringify({ userId, amount })
    });

    loadUsers();
}

/* REMOVE BALANCE */
async function removeBalance(userId) {

    let amount = document.getElementById("a-" + userId).value;

    if (!amount || amount <= 0) {
        alert("Invalid amount");
        return;
    }

    await fetch(API + "/admin/remove-balance", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "admin-password": "1234"
        },
        body: JSON.stringify({ userId, amount })
    });

    loadUsers();
}

</script>

</body>
</html>
